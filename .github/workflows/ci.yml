name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify root import isolation
        run: |
          python - <<'PY'
          import importlib.util

          assert importlib.util.find_spec("changepoint_lab") is None
          assert importlib.util.find_spec("toolkit") is None
          PY
      - name: Install Poetry
        run: python -m pip install --upgrade pip poetry
      - name: Install dependencies
        run: poetry install --with dev,docs,bench
      - name: Ruff critical checks
        run: poetry run ruff check .
      - name: Mypy configured checks
        run: poetry run mypy
      - name: Docstring checks
        run: poetry run pydocstyle src/changepoint_lab
      - name: Build Sphinx docs
        run: poetry run sphinx-build -b html docs docs/_build/html
      - name: Build distributions
        run: |
          poetry build
          poetry run python scripts/validate_distribution.py dist

  tests:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Poetry
        run: python -m pip install --upgrade pip poetry
      - name: Install dependencies
        run: poetry install --with dev,bench
      - name: Unit tests
        run: poetry run coverage run -m pytest -m "not slow" tests/unit
      - name: Integration tests
        run: |
          if [ -d tests/integration ]; then
            poetry run coverage run -a -m pytest -m integration tests/integration
          fi
      - name: Benchmarks
        run: |
          if [ -d tests/benchmarks ]; then
            poetry run pytest tests/benchmarks
          fi
      - name: Coverage report
        run: |
          poetry run coverage report
          poetry run coverage xml
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          fail_ci_if_error: false

  docs:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Poetry
        run: python -m pip install --upgrade pip poetry
      - name: Install dependencies
        run: poetry install --with dev,docs
      - name: Build documentation
        run: poetry run pdoc -o docs/_build changepoint_lab
      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs
          path: docs/_build

  cross-platform:
    runs-on: ${{ matrix.os }}
    env:
      MPLBACKEND: Agg
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Poetry
        run: python -m pip install --upgrade pip poetry
      - name: Install dependencies
        run: poetry install --with dev
      - name: Numerical stability tests
        run: poetry run pytest tests/unit
