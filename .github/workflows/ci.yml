name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify root import isolation
        run: |
          python - <<'PY'
          import importlib.util

          assert importlib.util.find_spec("changepoint_lab") is None
          assert importlib.util.find_spec("toolkit") is None
          PY
      - name: Install Poetry
        run: python -m pip install --upgrade pip poetry
      - name: Install dependencies
        run: poetry install --with dev,docs
      - name: Ruff critical checks
        run: poetry run ruff check .
      - name: Mypy configured checks
        run: poetry run mypy
      - name: Docstring checks
        run: poetry run pydocstyle src/changepoint_lab
      - name: Build canonical docs
        run: poetry run sphinx-build -W --keep-going -b html docs docs/_build/html
      - name: Validate local docs links
        run: poetry run python scripts/validate_docs_links.py
      - name: Build distributions
        run: |
          poetry build --clean
          poetry run python scripts/validate_distribution.py dist
          poetry run python scripts/validate_docs_examples.py --dist-dir dist

  tests:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Poetry
        run: python -m pip install --upgrade pip poetry
      - name: Install dependencies
        run: poetry install --with dev --extras "plot data"
      - name: Unit tests
        run: poetry run coverage run -m pytest -m "not slow" tests/unit
      - name: Integration tests
        run: |
          if [ -d tests/integration ]; then
            poetry run coverage run -a -m pytest -m integration tests/integration
          fi
      - name: Benchmarks
        run: |
          if [ -d tests/benchmarks ]; then
            poetry run pytest tests/benchmarks
          fi
      - name: Coverage report
        run: |
          poetry run coverage report
          poetry run coverage xml
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          fail_ci_if_error: false

  docs:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Poetry
        run: python -m pip install --upgrade pip poetry
      - name: Install dependencies
        run: poetry install --with dev,docs
      - name: Build canonical docs
        run: poetry run sphinx-build -W --keep-going -b html docs docs/_build/html
      - name: Build API inspection artifact
        run: poetry run pdoc -o docs/_build/pdoc changepoint_lab
      - name: Upload canonical docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: sphinx-docs
          path: docs/_build/html
      - name: Upload API inspection artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdoc-api-inspection
          path: docs/_build/pdoc

  cross-platform:
    runs-on: ${{ matrix.os }}
    env:
      MPLBACKEND: Agg
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Poetry
        run: python -m pip install --upgrade pip poetry
      - name: Install dependencies
        run: poetry install --with dev --extras "plot data"
      - name: Numerical stability tests
        run: poetry run pytest tests/unit

  compatibility:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - label: oldest
            python-version: "3.10"
            numpy-spec: "numpy==1.21.6"
          - label: newest
            python-version: "3.14"
            numpy-spec: "numpy>=2.3"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install core dependency set
        run: |
          python -m pip install --upgrade pip
          python -m pip install "${{ matrix.numpy-spec }}"
          python -m pip install --no-deps -e .
      - name: Core smoke without optional extras
        run: |
          python - <<'PY'
          import importlib.util
          import numpy as np
          import changepoint_lab as cpl
          from changepoint_lab.algorithms.optimization.pelt import (
              NormalMeanVarUnknown,
              bic_penalty,
          )

          assert importlib.util.find_spec("matplotlib") is None
          assert importlib.util.find_spec("pandas") is None
          assert cpl.__version__
          x = np.r_[np.zeros(6), np.ones(6)]
          cost = NormalMeanVarUnknown()
          cost.precompute(x)
          result = cpl.PELT(cost_fn=cost, penalty=bic_penalty(2, len(x))).fit_predict(x)
          assert result.indices.ndim == 1
          assert cpl.edivisive(x.reshape(-1, 1), min_size=2, R=3, resample="iid").change_points is not None
          PY
