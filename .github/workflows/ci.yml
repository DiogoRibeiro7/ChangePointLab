name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Ruff critical checks
        run: ruff check .
      - name: Mypy configured checks
        run: mypy
      - name: Docstring checks
        run: pydocstyle changepoint_lab
      - name: Build Sphinx docs
        run: sphinx-build -b html docs docs/_build/html
      - name: Build distributions
        run: python -m build

  tests:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Unit tests
        run: coverage run -m pytest -m "not slow" tests/unit
      - name: Integration tests
        run: |
          if [ -d tests/integration ]; then
            coverage run -a -m pytest -m integration tests/integration
          fi
      - name: Benchmarks
        run: |
          if [ -d tests/benchmarks ]; then
            pytest tests/benchmarks
          fi
      - name: Coverage report
        run: |
          coverage report
          coverage xml
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          fail_ci_if_error: false

  docs:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Build documentation
        run: pdoc -o docs/_build changepoint_lab
      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs
          path: docs/_build

  cross-platform:
    runs-on: ${{ matrix.os }}
    env:
      MPLBACKEND: Agg
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Numerical stability tests
        run: pytest tests/unit
