[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "changepoint-lab"
version = "0.1.1"
description = "ChangePointLab: a unified Python toolkit for changepoint detection in time series."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Diogo Ribeiro", email = "dfr@esmad.ipp.pt" }
]
maintainers = [
  { name = "Diogo Ribeiro", email = "dfr@esmad.ipp.pt" }
]
keywords = [
  "changepoint", "change-point", "time-series", "BOCPD", "PELT", "E-Divisive",
  "kernel methods", "HMM", "HSMM", "SD-HMM", "state-space models",
  "nonparametric statistics", "anomaly detection"
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
# Minimal runtime deps; matplotlib kept optional via extras
dependencies = [
  "numpy>=1.21",
  "pandas>=1.5",
  "matplotlib>=3.3"
]

[project.optional-dependencies]
plot = ["matplotlib>=3.3"]
dev = [
  "pytest>=7",
  "ruff>=0.3",
  "mypy>=1.6",
  "types-setuptools"
]

[project.scripts]
cpd = "toolkit.cpd_cli:main"
cpd-cli = "toolkit.cpd_cli:main"
bocpd-cli = "changepoint_lab.cli.bocpd_cli:main"
within-period-cli = "changepoint_lab.algorithms.bayesian.within_period.cli:main"

[project.urls]
Homepage = "https://github.com/DiogoRibeiro7/ChangePointLab"
Repository = "https://github.com/DiogoRibeiro7/ChangePointLab"
Issues = "https://github.com/DiogoRibeiro7/ChangePointLab/issues"
Documentation = "https://github.com/DiogoRibeiro7/ChangePointLab/tree/main/docs"
Changelog = "https://github.com/DiogoRibeiro7/ChangePointLab/blob/main/CHANGELOG.md"

# ---- setuptools config -------------------------------------------------------
[tool.setuptools]
py-modules = []
include-package-data = true

[tool.setuptools.packages.find]
include = ["changepoint_lab*", "toolkit*"]

# ---- tooling (optional but handy) -------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "B", "UP"]
ignore = []

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
strict_optional = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q"
python_files = ["test_*.py", "*_test.py"]
pythonpath = ["."]
markers = [
    "integration: integration tests requiring external resources",
    "slow: long-running tests"
]
