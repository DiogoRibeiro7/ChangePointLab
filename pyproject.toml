[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "changepoint-lab"
version = "0.1.6"
description = "ChangePointLab: a unified Python toolkit for changepoint detection in time series."
readme = "README.md"
requires-python = ">=3.10,<4.0"
license = "MIT"
authors = [
  { name = "Diogo Ribeiro", email = "dfr@esmad.ipp.pt" }
]
maintainers = [
  { name = "Diogo Ribeiro", email = "dfr@esmad.ipp.pt" }
]
keywords = [
  "changepoint", "change-point", "time-series", "BOCPD", "PELT", "E-Divisive",
  "kernel methods", "HMM", "HSMM", "SD-HMM", "state-space models",
  "nonparametric statistics", "anomaly detection"
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
  "numpy>=1.21,<2.3; python_version < '3.14'",
  "numpy>=2.3; python_version >= '3.14'"
]

[project.optional-dependencies]
plot = ["matplotlib>=3.3"]
data = ["pandas>=1.5"]

[project.scripts]
cpd = "changepoint_lab.cli.cpd_cli:main"
cpd-cli = "changepoint_lab.cli.cpd_cli:main"
bocpd-cli = "changepoint_lab.cli.bocpd_cli:main"
within-period-cli = "changepoint_lab.algorithms.bayesian.within_period.cli:main"

[project.urls]
Homepage = "https://github.com/DiogoRibeiro7/ChangePointLab"
Repository = "https://github.com/DiogoRibeiro7/ChangePointLab"
Issues = "https://github.com/DiogoRibeiro7/ChangePointLab/issues"
Documentation = "https://github.com/DiogoRibeiro7/ChangePointLab/tree/main/docs"
Changelog = "https://github.com/DiogoRibeiro7/ChangePointLab/blob/main/CHANGELOG.md"

[tool.poetry]
packages = [{ include = "changepoint_lab", from = "src" }]
include = [
  { path = "src/changepoint_lab/py.typed", format = ["sdist", "wheel"] }
]
exclude = [
  "**/__pycache__/**",
  "**/*.pyc",
  "docs/_build/**",
  "examples/**",
  "paper/**",
  "papers/**",
  "prompts/**",
  "scripts/**",
  "tests/**"
]

[tool.poetry.group.docs.dependencies]
networkx = ">=3"
pdoc = ">=15"
sphinx = ">=7"

[tool.poetry.group.bench]
optional = true

[tool.poetry.group.bench.dependencies]

[tool.poetry.group.dev.dependencies]
coverage = ">=7"
libcst = ">=1.0"
mypy = ">=1.6"
pip-audit = ">=2.7"
pip-licenses = ">=5"
pydocstyle = ">=6"
pytest = ">=7"
pytest-cov = ">=4"
ruff = ">=0.3"
tomli = { version = ">=2", python = "<3.11" }
types-setuptools = "*"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["build", "dist", "*.egg-info"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
ignore = []

[tool.mypy]
python_version = "3.10"
files = [
  "src/changepoint_lab/core/datatypes.py",
  "src/changepoint_lab/algorithms/_base.py",
  "tests/typecheck/result_contracts.py"
]
follow_imports = "skip"
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
strict_optional = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.pydocstyle]
match_dir = "^(?!build|dist|.*\\.egg-info).*$"
add_ignore = [
  "D100", "D101", "D102", "D103", "D104", "D105", "D107",
  "D200", "D204", "D205", "D301", "D400", "D401", "D403"
]

[tool.pytest.ini_options]
addopts = "-q"
python_files = ["test_*.py", "*_test.py"]
markers = [
  "integration: integration tests requiring external resources",
  "slow: long-running tests"
]
