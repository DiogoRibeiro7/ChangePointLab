[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cp-ss-toolkit"
version = "0.1.0"
description = "Change-Point & State-Space Toolkit: Bayesian Blocks, E-Divisive, Kernel CPD (PELT), RFF CPD, SD-HMM, HSMM — NumPy-only implementations."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Contributors" }
]
keywords = [
  "changepoint", "change-point", "kernel", "PELT", "Bayesian Blocks", "E-Divisive",
  "HMM", "HSMM", "RFF", "time-series", "nonparametric"
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
# Minimal runtime deps; matplotlib kept optional via extras
dependencies = [
  "numpy>=1.21"
]

[project.optional-dependencies]
plot = ["matplotlib>=3.3"]
dev = [
  "pytest>=7",
  "ruff>=0.3",
  "mypy>=1.6",
  "types-setuptools"
]

[project.urls]
Homepage = "https://example.com/"
Repository = "https://example.com/repo"
Issues = "https://example.com/repo/issues"

# ---- setuptools config -------------------------------------------------------
[tool.setuptools]
# This project is laid out as a collection of single-file modules at the repo root.
# If you later move code into a package directory, switch to `packages = ["yourpkg"]`.
py-modules = [
  "bayesian_blocks",
  "bb_plotting",
  "bb_utils",
  "edivisive",
  "edivisive_plotting",
  "kcp",
  "kcp_plotting",
  "kcp_rff",
  "sdhmm",
  "sdhmm_mix_vi",
  "hsmm",
  "gaussian_diag",
]
include-package-data = true

# ---- tooling (optional but handy) -------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "B", "UP"]
ignore = []

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
strict_optional = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q"
python_files = ["test_*.py", "*_test.py"]
